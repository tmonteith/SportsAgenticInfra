name: Infra CI - PR Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.hcl'
      - '.github/workflows/ci-pr.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  fmt-validate:
    name: Format and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"

      - name: Check Formatting
        id: fmt
        run: tofu fmt -check -recursive .

      - name: Validate Bootstrap Stack
        run: |
          cd bootstrap
          tofu init -backend=false
          tofu validate

      - name: Validate Root Infrastructure Stack
        run: |
          tofu init -backend=false
          tofu validate

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  tofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    needs: [fmt-validate, security-scan]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"

      - name: Setup OCI Credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          if [ -z "$OCI_PRIVATE_KEY" ]; then
            echo "OCI credentials not configured yet. Skipping remote plan."
            echo "configured=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "configured=true" >> $GITHUB_ENV
          mkdir -p ~/.oci
          echo "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          EOF
          chmod 600 ~/.oci/config

      - name: OpenTofu Init with Remote State
        if: env.configured == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="endpoint=${{ secrets.TFSTATE_S3_ENDPOINT }}" \
            -backend-config="region=${{ secrets.OCI_REGION }}" \
            -backend-config="access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - name: OpenTofu Plan
        id: plan
        if: env.configured == 'true'
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          tofu plan -no-color -out=tfplan | tee plan_output.txt

      - name: Post Plan Summary to Pull Request
        if: env.configured == 'true' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planText = 'No plan output captured.';
            if (fs.existsSync('plan_output.txt')) {
              planText = fs.readFileSync('plan_output.txt', 'utf8');
            }
            if (planText.length > 60000) {
              planText = planText.slice(0, 60000) + '\n... [Plan diff truncated due to size limits]';
            }

            const body = `### 🌐 OpenTofu PR Plan Result: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan Diff</summary>

            \`\`\`hcl
            ${planText}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }} | Action: \`${{ github.event_name }}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('OpenTofu PR Plan Result')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
