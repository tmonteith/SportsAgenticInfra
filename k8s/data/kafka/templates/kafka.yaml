apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Values.nodePool.name }}
  labels:
    strimzi.io/cluster: {{ .Values.clusterName }}
    app.kubernetes.io/part-of: sportsagentic
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.nodePool.replicas }}
  roles:
    - controller
    - broker
  resources:
    {{- toYaml .Values.nodePool.resources | nindent 4 }}
  jvmOptions:
    -Xms: {{ .Values.nodePool.heap | quote }}
    -Xmx: {{ .Values.nodePool.heap | quote }}
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.storage.size }}
        class: {{ .Values.storage.class }}
        deleteClaim: {{ .Values.storage.deleteClaim }}
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.clusterName }}
  labels:
    app.kubernetes.io/part-of: sportsagentic
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  kafka:
    version: {{ .Values.kafka.version | quote }}
    metadataVersion: {{ .Values.kafka.metadataVersion | quote }}
    listeners:
      {{- toYaml .Values.kafka.listeners | nindent 6 }}
    config:
      {{- toYaml .Values.kafka.config | nindent 6 }}
  entityOperator:
    topicOperator:
      resources:
        {{- toYaml .Values.entityOperator.topicOperator.resources | nindent 8 }}
