{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name }}
  labels:
    strimzi.io/cluster: {{ $.Values.clusterName }}
    app.kubernetes.io/part-of: sportsagentic
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  topicName: {{ .topicName }}
  partitions: {{ .partitions }}
  replicas: {{ .replicas }}
  config:
    {{- toYaml $.Values.topicConfig | nindent 4 }}
{{- end }}
