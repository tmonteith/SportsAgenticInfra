clusterSecretStore:
  name: oci-vault
  # OCI region of the vault, e.g. us-chicago-1. Required.
  region: ""
  # OCID of the vault. Required; set by modules/secrets.
  vault: ""
  # Namespaces allowed to use this store. Empty means every namespace.
  namespaces: []

# How often each ExternalSecret re-reads its vault secret.
refreshInterval: 1h

# Data key inside every synced Kubernetes Secret (mounted as /var/secrets/gcp/key.json).
secretKey: key.json

# One entry per workload: the vault secret and the Kubernetes Secret share the name.
# - name: gcp-key-extractor
#   namespace: data
externalSecrets: []
