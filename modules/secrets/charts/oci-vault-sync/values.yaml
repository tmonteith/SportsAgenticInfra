clusterSecretStore:
  name: oci-vault
  # OCI region of the vault, e.g. us-chicago-1. Required.
  region: ""
  # OCID of the vault. Required; set by modules/secrets.
  vault: ""
  # Namespaces allowed to use this store. Empty means every namespace.
  namespaces: []

# How often each ExternalSecret re-reads its vault secret.
refreshInterval: 1h

# Default data key of a synced Kubernetes Secret (the GCP keys, mounted as
# /var/secrets/gcp/key.json). An entry's own secretKey overrides it.
secretKey: key.json

# One entry per secret: the vault secret and the Kubernetes Secret share the
# name, and the whole vault value lands under one data key.
# - name: gcp-key-extractor
#   namespace: data
#   secretKey: key.json   # optional; defaults to secretKey above
#   type: Opaque          # optional; a non-Opaque type (e.g.
#                         # kubernetes.io/dockerconfigjson) is set through
#                         # target.template.type
externalSecrets: []
