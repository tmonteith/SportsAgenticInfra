apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: oci-vault-sync
spec:
  provider:
    oracle:
      vault: {{ required "clusterSecretStore.vault is required" .Values.clusterSecretStore.vault | quote }}
      region: {{ required "clusterSecretStore.region is required" .Values.clusterSecretStore.region | quote }}
      # Basic OKE clusters have no workload identity, so the operator
      # authenticates as the node it runs on.
      principalType: InstancePrincipal
  {{- with .Values.clusterSecretStore.namespaces }}
  # Only these namespaces may reference this store.
  conditions:
    - namespaces:
        {{- toYaml . | nindent 8 }}
  {{- end }}
