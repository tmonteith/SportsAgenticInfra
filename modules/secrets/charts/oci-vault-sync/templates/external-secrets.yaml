{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "externalSecrets[].name is required" .name }}
  namespace: {{ required "externalSecrets[].namespace is required" .namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: oci-vault-sync
spec:
  refreshInterval: {{ $.Values.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.clusterSecretStore.name }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $.Values.secretKey }}
      remoteRef:
        key: {{ .name }}
{{- end }}
