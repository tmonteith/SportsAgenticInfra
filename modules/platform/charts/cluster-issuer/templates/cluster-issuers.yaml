apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cluster-issuer
spec:
  acme:
    server: {{ .Values.stagingServer }}
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingressClass }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cluster-issuer
spec:
  acme:
    server: {{ .Values.productionServer }}
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingressClass }}
